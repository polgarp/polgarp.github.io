# Drives the "beyond work" section of /about. The caption
# defaults to `default` and swaps to a facet's note on hover/focus.

beyond:
  default: "Outside work, I chase the whimsy of details that create emergent ideas."
  facets:
    - label: "Cooking"
      note: "Mostly improvised, occasionally ambitious, a mix of creative techniques for new dishes and effective meal planning."
    - label: "Sci-fi"
      note: "I read for the ideas as much as for the stories. Exploring futures helps to argue with the present."
    - label: "Boardgames"
      note: "Systems you can hold, rules that turn strangers into a table of schemers."
    - label: "Painting"
      note: "Slow, analogue, and gloriously undo-less, the opposite of pixels."
    - label: "Cities"
      note: "I explore new ones on foot, enjoying people expressing themselves via systems, artifacts, and ideas."

contact:
  line: "I mentor designers and advise teams occasionally on design practice, discovery, and growing people."
