# Drives the "beyond work" section of /about. Notes are DRAFTS in Péter's voice
# — correct the specifics (authors, games, painting style, cities). The caption
# defaults to `default` and swaps to a facet's note on hover/focus.

beyond:
  default: "Outside work, I chase the whimsy of details that create emergent ideas."
  facets:
    - label: "Cooking"
      note: "Mostly improvised, occasionally ambitious — the kitchen is where I think with my hands."
    - label: "Sci-fi"
      note: "I read it for the ideas: futures that argue with the present."
    - label: "Boardgames"
      note: "Systems you can hold — a ruleset that turns strangers into a table of schemers."
    - label: "Painting"
      note: "Slow, analogue, and gloriously undo-less — the opposite of pixels."
    - label: "Cities"
      note: "I explore new ones on foot, collecting the small design decisions most people walk past."

contact:
  line: "I mentor designers and advise teams now and then — on design practice, discovery, and growing people."
