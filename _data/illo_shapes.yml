# Objects an illustration can be built on. Single source of truth: the include
# emits `d` into the static SVG fallback AND into a data attribute the engine
# reads, so the live and no-JS versions can never disagree.
#
# All drawn in a 100x100 box. Abstract only — a literal subject reads as a
# smudge at cell resolution, and an abstract object carrying a verb says more
# than a picture of a thing anyway. Holes rely on opposite winding (nonzero
# fill), which canvas and SVG agree on.
#
# fit: wide     stretch to fill the figure. For shapes with no meaningful
#               aspect ratio, where filling the column reads better.
# fit: contain  keep the aspect ratio. For shapes that would look wrong
#               stretched — anything round or angled.

rect:
  d: "M14 22 H86 V78 H14 Z"
  fit: wide
frame:
  d: "M10 20 H90 V80 H10 Z M20 30 V70 H80 V30 Z"
  fit: wide
band:
