# Drives the /portfolio/ (Journey) page. Curation + framing live here;
# factual card data (title, url, logo, role, period) is pulled from each
# case study's own front matter by _includes/journey-card.html.

intro:
  lead: "I make systems work for humans, at every altitude."
  sub: "Fifteen years of founding and leading design teams, and staying close enough to the work to build it."

# Top-of-page credibility scan. Logos live in assets/images/portfolio/.
#
# `logo_height` is an optical correction, not a measurement. Set to one uniform
# height these five wordmarks carry very different visual weight — Emarsys ran
# 2.2x the area of Krisp — so the strip read as unconsidered, which is the
# opposite of what a credibility scan is for. Absent, a logo falls back to 1.5rem.
career:
  - company: "Prezi"
    logo_height: "1.5rem"
    logo: /assets/images/portfolio/prezi-logo.png
    role: "UX Researcher"
    period: "2011–2014"
  - company: "Emarsys"
    logo_height: "1.25rem"
    logo: /assets/images/portfolio/emarsys-logo.svg
    role: "Head of UX"
    period: "2015–2018"
  - company: "Trustpilot"
    logo_height: "1.6rem"
    logo: /assets/images/portfolio/trustpilot-logo.png
    role: "Senior UX Manager"
    period: "2018–2021"
  - company: "Krisp"
    logo_height: "1.7rem"
    logo: /assets/images/portfolio/krisp-logo.svg
    role: "Lead Product Designer"
    period: "2021–2023"
  - company: "Canonical"
    logo_height: "1.4rem"
    logo: /assets/images/portfolio/canonical-logo.svg
    # role omitted on purpose: the current role lives in _config.yml (site.current.role)
    period: "2024–"

areas:
  - num: "01"
    label: "coherence"
    headline: "Driving product coherence at scale"
    line: "When teams build independently, products fragment. I align them around the user's journey so the whole feels like one product, and holds together as a system teams and their agents can build on."
    key:
      slug: 2019-aligning-teams-through-an-ia-redesign
      image: /assets/images/portfolio/hints/hint-coherence.jpg
      blurb: "Unified seven teams' fragmented B2B app behind one information architecture. ~20% more users reached their intended flows, and the IA outlived me by years."
    more:
      - 2026-build-a-horizontal-framework-with-ai
      - 2026-making-a-complex-portfolio-feel-simple
      - 2016-from-ui-kit-to-design-system-team

  - num: "02"
    label: "strategy"
    headline: "Shaping strategy through design vision"
    line: "A strategy argument needs something to point at. I use vision prototypes to make decisions easier, show where teams actually disagree, and feed concrete roadmaps and specs."
    key:
      slug: 2026-setting-direction-down-to-the-details
      image: /assets/images/portfolio/hints/hint-pro.jpg
      blurb: "A new layer over seven services, held together by one prototype that carries today's scope and the long-term picture at once."
    more:
      - 2022-design-vision-product-vision

  - num: "03"
    label: "discovery"
    headline: "Embedding discovery into product decisions"
    line: "Good products come from understanding, not assumptions. I make discovery rigorous enough that the understanding lasts, becoming context the whole team and their agents can act on."
    key:
      slug: 2022-raising-org-maturity-through-product-work
      image: /assets/images/portfolio/hints/hint-discovery.jpg
      blurb: "Used real product work to pull a startup's practices up a maturity level, discovery by example, not decree."
    more:
      - 2020-a-data-driven-approach-to-design-strategy
      - 2017-a-ux-process-for-transparent-collaboration

  - num: "04"
    label: "teams"
    headline: "Building and scaling design teams"
    line: "A good team makes everyone around it better. I build teams with clear growth, embedded practice, and deliberate org design."
    key:
      slug: 2015-designing-a-ux-team
      image: /assets/images/portfolio/hints/hint-teams.jpg
      blurb: "Built Emarsys' first UX team and practice from scratch, with the next two heads of UX promoted from within."
    more:
      - 2021-building-a-user-research-team
      - 2021-four-leadership-modes-for-a-troubled-launch
      - 2018-improve-with-experience-stories

foundations:
  line: "Earlier, as a UX researcher at Prezi, I built the craft this all rests on, and a habit of learning in public."
  slugs:
    - 2013-learning-with-stories-in-mobile-app-design
    - 2014-shared-understanding-with-story-mapping
    - 2012-testing-prototypes-along-the-fidelity-range
    - 2011-usability-testing-the-prezi-editor
    - 1980-Learn-Teach-Organise

# The close. Directional rather than a job ad: it names the shape of the work
# rather than the title, which is both truer and legible to a current employer.
cta:
  headline: "Direction"
  line: "Coherence across a portfolio, the discovery that keeps it grounded, and the team to sustain it, in a deep-tech domain where the problems are hard enough to need all three."
  invite: "If that's the shape of your problem, I'd like to hear about it."
