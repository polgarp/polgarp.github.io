---
layout: default
---
<article class="page-single">
  {% if page.title %}
  <header class="post__header">
    <h1 class="post__title">{{ page.title }}</h1>
    {% if page.excerpt %}<div class="post__lede">{{ page.excerpt | markdownify }}</div>{% endif %}
    {% if page.header.actions %}
    <p class="post__actions">
      {% for action in page.header.actions %}
      <a class="button" href="{{ action.url | relative_url }}">{{ action.label }}</a>
      {% endfor %}
    </p>
    {% endif %}
  </header>
  {% endif %}

  <div class="post__body">
    {{ content }}
  </div>
</article>
