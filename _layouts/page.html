---
layout: default
---
<article class="page-single">
  {% if page.avatar %}
  <img class="page-avatar" src="{{ page.avatar | relative_url }}" alt="Portrait of {{ site.name }}">
  {% endif %}

  {% if page.title %}
  <header class="post__header">
    {% comment %} markdownify so emphasis in titles renders; strip the <p> wrapper {% endcomment %}
    <h1 class="post__title">{{ page.title | markdownify | remove: '<p>' | remove: '</p>' }}</h1>
  </header>
  {% endif %}

  {% if page.header.image %}
  <figure class="post__hero">
    <img src="{{ page.header.image | relative_url }}" alt="" loading="eager">
  </figure>
  {% endif %}

  <div class="post__body">
    {{ content }}
  </div>
</article>
