<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400">
  <title>Personas, jobs and journeys as one framework</title>
  <style>
    .dg-frame { fill: none; stroke: var(--rule-strong, #949494); stroke-width: 1.5; }
    .dg-box   { fill: var(--surface, #f5f5f5); stroke: var(--rule, #e4e4e4); stroke-width: 1; }
    .dg-spine { fill: var(--surface, #f5f5f5); stroke: var(--accent, #d62828); stroke-width: 1.5; }
    .dg-open  { fill: none; stroke: var(--rule, #e4e4e4); stroke-width: 1; }
    .dg-h     { font: 700 15px var(--font-mono, ui-monospace, monospace); fill: var(--ink, #000); }
    .dg-sub   { font: 400 11px var(--font-mono, ui-monospace, monospace); fill: var(--ink-muted, #6e6e6e); }
    .dg-t     { font: 700 13px var(--font-mono, ui-monospace, monospace); fill: var(--ink, #000); }
    .dg-ta    { font: 700 13px var(--font-mono, ui-monospace, monospace); fill: var(--accent, #d62828); }
    .dg-body  { font: 400 11px var(--font-mono, ui-monospace, monospace); fill: var(--ink-muted, #6e6e6e); }
  </style>

  <rect class="dg-frame" x="40" y="36" width="1040" height="328"/>
  <text class="dg-h" x="64" y="66">Personas, jobs and journeys as one framework</text>
  <text class="dg-sub" x="64" y="86">One persona, the jobs it is trying to get done, and the product journeys that serve them.</text>

  <!-- the persona spine, held apart from the job columns it feeds -->
  <rect class="dg-spine" x="64" y="112" width="200" height="116"/>
  <text class="dg-ta" x="80" y="138">Persona</text>
  <text class="dg-body" x="80" y="162">how to recognise</text>
  <text class="dg-body" x="80" y="182">pain points</text>
  <text class="dg-body" x="80" y="202">push / pull</text>

  <rect class="dg-box" x="64" y="244" width="200" height="76"/>
  <text class="dg-t" x="80" y="270">Product context</text>
  <text class="dg-body" x="80" y="294">scope, constraints</text>

  <!-- main job 1 -->
  <rect class="dg-box" x="296" y="112" width="360" height="40"/>
  <text class="dg-t" x="312" y="138">Main job 1</text>
  <rect class="dg-open" x="296" y="168" width="112" height="34"/>
  <text class="dg-body" x="312" y="190">Job 1</text>
  <rect class="dg-open" x="420" y="168" width="112" height="34"/>
  <text class="dg-body" x="436" y="190">Job 2</text>
  <rect class="dg-open" x="544" y="168" width="112" height="34"/>
  <text class="dg-body" x="560" y="190">…</text>
  <rect class="dg-box" x="296" y="218" width="360" height="34"/>
  <text class="dg-body" x="312" y="240">User needs</text>
  <rect class="dg-box" x="296" y="272" width="360" height="34"/>
  <text class="dg-body" x="312" y="294">Job to product fit</text>
  <rect class="dg-open" x="296" y="316" width="174" height="34"/>
  <text class="dg-body" x="312" y="338">Product 1 CUJ</text>
  <rect class="dg-open" x="482" y="316" width="174" height="34"/>
  <text class="dg-body" x="498" y="338">Product 2 CUJ</text>

  <!-- main job 2 -->
  <rect class="dg-box" x="696" y="112" width="360" height="40"/>
  <text class="dg-t" x="712" y="138">Main job 2</text>
  <rect class="dg-open" x="696" y="168" width="112" height="34"/>
  <text class="dg-body" x="712" y="190">Job 1</text>
  <rect class="dg-open" x="820" y="168" width="112" height="34"/>
  <text class="dg-body" x="836" y="190">Job 2</text>
  <rect class="dg-open" x="944" y="168" width="112" height="34"/>
  <text class="dg-body" x="960" y="190">…</text>
  <rect class="dg-box" x="696" y="218" width="360" height="34"/>
  <text class="dg-body" x="712" y="240">User needs</text>
  <rect class="dg-box" x="696" y="272" width="360" height="34"/>
  <text class="dg-body" x="712" y="294">Job to product fit</text>
  <rect class="dg-open" x="696" y="316" width="174" height="34"/>
  <text class="dg-body" x="712" y="338">Product 3 CUJ</text>
</svg>
