<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 444" width="1120" height="444">
  <title>What crosses the line</title>
  <style>
    .dg-frame { fill: none; stroke: var(--rule-strong, #949494); stroke-width: 1.5; }
    .dg-box   { fill: var(--surface, #f5f5f5); stroke: var(--rule, #e4e4e4); stroke-width: 1; }
    .dg-gate  { fill: var(--surface, #f5f5f5); stroke: var(--accent, #d62828); stroke-width: 1.5; }
    .dg-h     { font: 700 15px var(--font-mono, ui-monospace, monospace); fill: var(--ink, #000); }
    .dg-sub   { font: 400 11px var(--font-mono, ui-monospace, monospace); fill: var(--ink-muted, #6e6e6e); }
    .dg-t     { font: 700 13px var(--font-mono, ui-monospace, monospace); fill: var(--ink, #000); }
    .dg-role  { font: 400 10.5px var(--font-mono, ui-monospace, monospace); fill: var(--ink-muted, #6e6e6e); }
    .dg-gaterole { font: 400 10.5px var(--font-mono, ui-monospace, monospace); fill: var(--accent, #d62828); }
    .dg-body  { font: 400 11px var(--font-mono, ui-monospace, monospace); fill: var(--ink-muted, #6e6e6e); }
    .dg-arrow { stroke: var(--ink-muted, #6e6e6e); stroke-width: 1.4; fill: var(--ink-muted, #6e6e6e); }
    .dg-line  { stroke: var(--rule-strong, #949494); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dg-mask  { fill: var(--paper, #fff); }
  </style>

  <rect class="dg-frame" x="40" y="36" width="1040" height="372"/>
  <text class="dg-h" x="64" y="66">What crosses the line</text>
  <text class="dg-sub" x="64" y="86">Each kind of software hands over something different, and leaves different work to the user.</text>

  <!-- column heads -->
  <text class="dg-role" x="248" y="128">AUTHOR SHIPS</text>
  <text class="dg-role" x="628" y="128">USER DOES</text>

  <!-- the handover line -->
  <line class="dg-line" x1="572" y1="112" x2="572" y2="392"/>

  <!-- arrows across the line -->
  <g class="dg-arrow">
    <line x1="536" y1="176" x2="600" y2="176"/><path d="M600,172 L606,176 L600,180 Z"/>
    <line x1="536" y1="262" x2="600" y2="262"/><path d="M600,258 L606,262 L600,266 Z"/>
    <line x1="536" y1="348" x2="600" y2="348"/><path d="M600,344 L606,348 L600,352 Z"/>
  </g>

  <!-- closed -->
  <text class="dg-t" x="64" y="170">Closed</text>
  <text class="dg-role" x="64" y="188">paid, packaged</text>
  <rect class="dg-box" x="232" y="140" width="300" height="72"/>
  <text class="dg-t" x="248" y="170">Binary</text>
  <text class="dg-body" x="248" y="190">Packaged per platform.</text>
  <rect class="dg-box" x="612" y="140" width="444" height="72"/>
  <text class="dg-t" x="628" y="170">Run it</text>
  <text class="dg-body" x="628" y="190">As shipped, with no way to change.</text>

  <!-- open source -->
  <text class="dg-t" x="64" y="256">Open source</text>
  <text class="dg-role" x="64" y="274">free to change</text>
  <rect class="dg-box" x="232" y="226" width="300" height="72"/>
  <text class="dg-t" x="248" y="256">Source + binaries</text>
  <text class="dg-body" x="248" y="276">Packaging is mostly on the author.</text>
  <rect class="dg-box" x="612" y="226" width="444" height="72"/>
  <text class="dg-t" x="628" y="256">Run it, or change it</text>
  <text class="dg-body" x="628" y="276">If they can read the code and build it.</text>

  <!-- open intent -->
  <text class="dg-t" x="64" y="342">Open intent</text>
  <text class="dg-gaterole" x="64" y="360">free to rebuild</text>
  <rect class="dg-gate" x="232" y="312" width="300" height="72"/>
  <text class="dg-t" x="248" y="342">Description</text>
  <text class="dg-body" x="248" y="362">Problem, approach, trade-offs, cost.</text>
  <rect class="dg-box" x="612" y="312" width="444" height="72"/>
  <text class="dg-t" x="628" y="342">A coding agent builds it</text>
  <text class="dg-body" x="628" y="362">On their platform, with their changes and token spend.</text>
</svg>
