<header class="masthead">
  <div class="shell-wide masthead__inner">
    <a class="masthead__brand" href="{{ '/' | relative_url }}" rel="home">
      {% include logo.svg %}
      <span class="masthead__name">Péter Balázs Polgár</span>
    </a>
    <div class="masthead__right">
      <nav class="masthead__nav" aria-label="Primary">
        <ul>
          {% for item in site.data.navigation.main %}
          <li>
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
          {% endfor %}
        </ul>
      </nav>
      <div class="masthead__tools">
        <button id="search-toggle" type="button" aria-label="Search (press /)" title="Search ( / )">/</button>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      </div>
    </div>
  </div>
</header>
