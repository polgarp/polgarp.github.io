<header class="masthead">
  <div class="shell masthead__inner">
    <a class="masthead__brand" href="{{ '/' | relative_url }}" rel="home">
      {% include logo.svg %}
      <span class="masthead__name">Péter Balázs Polgár</span>
    </a>
    <div class="masthead__right">
      <nav class="masthead__nav" id="primary-nav" aria-label="Primary">
        <ul>
          {% for item in site.data.navigation.main %}
          <li>
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
          {% endfor %}
        </ul>
      </nav>
      <div class="masthead__tools">
        <button id="menu-toggle" class="masthead__menu" type="button" aria-label="Menu" aria-expanded="false" aria-controls="primary-nav">
          <span class="masthead__menu-bars" aria-hidden="true"></span>
        </button>
        <button id="search-toggle" type="button" aria-label="Search (press /)" title="Search ( / )">/</button>
        <button id="theme-toggle" class="theme-switch" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <span class="theme-switch__box" aria-hidden="true"><i class="theme-switch__block"></i></span>
        </button>
      </div>
    </div>
  </div>
</header>
