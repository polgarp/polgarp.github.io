# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Péter Balázs Polgár"
tagline: "Design explorer. Building products and product design teams."
name: "Péter Balázs Polgár"
url: "https://polgarp.com"
email: hello@polgarp.com
description: >- # this means to ignore newlines until "baseurl:"
  Design explorer. Building products and product design teams.
  Ideas and stuff by Péter Balázs Polgár, product design leader.
twitter_username: polgarp
github_username: polgarp
mastodon_url: "https://mastodon.online/@polgarp"
linkedin_url: "https://linkedin.com/in/peterbalazspolgar"
newsletter_url: "/categories/newsletter/"
logo: "/assets/images/logo.png"



# Site UI settings (consumed by the custom layouts/includes)

# The current role, stated once. Liquid does not run in _config.yml, so
# templates compose these atoms rather than repeating the title in prose.
# _data/journey.yml deliberately omits a role for Canonical so the career
# strip falls back to this same string.
current:
  role: "Lead Experience Designer"
  company: "Canonical"
  company_url: "https://canonical.com/"
  focus: "designing humane human–AI workflows"

intro:
  # The opening statement on the home page, and nothing else — `tagline` above
  # is what the browser tab carries. This is the positioning spine, the same
  # sentence as the CV, LinkedIn and the Journey page, so the surfaces agree.
  #
  # No link inside it, deliberately: a link would be red, and the only red in
  # the opening view should be red the reader caused by moving the cursor over
  # the illustration. Journey is one item along in the nav either way.
  # Kept as the canonical wording; the home page sets it as literal text so its
  # hand-placed line breaks live next to it. Change both together.
  lede: 'I make systems work for humans, at every altitude.'
colophon: "black, red, white & monospace"
newsletter_embed: "https://embeds.beehiiv.com/37db567b-1484-4bb3-8430-ed1d569535ca?slim=true"
share_service: "https://mastodonshare.com/?text="


# TEMPORARY: loads assets/js/illustration/tune.js on pages with an
# illustration, so the background layer's numbers can be dialled in live.
# Delete this flag and that file once they are settled.
illo_tune: false

# Build settings
markdown: kramdown

# Outputting
permalink: /:categories/:title/
date_format: "%Y. %B %d"
timezone: Europe/Copenhagen

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
# Extra RSS feed for newsletter subscribers at /feed/newsletter.xml
feed:
  categories:
    - newsletter

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-seo-tag

author:
  name: "Péter Balázs Polgár"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: case-study
  # _playground
  - scope:
      path: ""
      type: playground
    values:
      layout: page

collections:
  portfolio:
    output: true
    permalink: /:collection/:path/
  playground:
    output: true
    permalink: /:collection/:path/

social:
  type: "Person"
  name:  "Péter Balázs Polgár"
  links:
    - "https://twitter.com/polgarp"
    - "https://linkedin.com/in/peterbalazspolgar"

twitter:
  username: "polgarp"
